# Publish src/ to GitHub Pages: https://n03l.github.io/vigo/
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# actions are pinned to commit SHAs: a re-tagged release can't change what runs with these permissions
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Unit tests
        run: npm test

      - name: Stamp the commit
        # the short id is enough to show and to link to the commit on GitHub
        run: |
          printf '{"commit": "%s"}\n' "${GITHUB_SHA::7}" > src/version.json

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: src

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
