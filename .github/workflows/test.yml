# Unit tests on every push and pull request. Vercel deploys main by itself (vercel.json).
name: test

on:
  push:
  pull_request:

# actions are pinned to commit SHAs: a re-tagged release can't change what runs
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - run: npm test
